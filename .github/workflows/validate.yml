name: validate-release
on:
  push:
  pull_request:
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q src scripts
      - name: Release metadata check
        run: python scripts/verify_release.py
